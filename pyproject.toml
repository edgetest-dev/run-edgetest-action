[build-system]
requires = ["setuptools>=64.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "toy_package"
version = "0.1.0"
description = "Fake description"
requires-python = ">=3.9.0"
dependencies = ["pandas<=2.0.0"]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools]
zip-safe = false
include-package-data = true

# NOTE: the ``edgetest`` conda-forge package (2026.1.0) only reads the legacy
# ``[edgetest]`` table from TOML files. The ``[tool.edgetest]`` style is not
# yet available on conda-forge; switch once it ships (see issue #28 notes).
[edgetest]
python_version = "3.11"
extras = ["tests"]
deps = ["pip-tools"]

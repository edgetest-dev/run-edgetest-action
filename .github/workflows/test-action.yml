# This workflow will install edgetest and  edgetest-conda and run it on the run-edgetest-action
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Test edgetest action

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
    - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb  # v4.1.0
      with:
        auto-update-conda: true
        python-version: ${{ matrix.python-version }}
        channels: conda-forge
    - name: Install edgetest edgetest-conda and edgetest-pip-tools
      run: conda install edgetest edgetest-conda edgetest-pip-tools
    - name: Run edgetest action
      uses: ./
      with:
        edgetest-flags: '--config=pyproject.toml --export'
        base-branch: 'dev'
        skip-pr: 'true'
        python-version: ${{ matrix.python-version }}
        add-paths: 'pyproject.toml, requirements.txt'